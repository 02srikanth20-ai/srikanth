<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #334155;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .score-box h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .score-box span {
      font-size: 2rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .display {
      margin: 1.5rem 0;
      min-height: 80px;
    }

    .choices-display {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .result-text {
      font-size: 1.5rem;
      font-weight: bold;
      height: 2rem;
    }

    .win { color: #4ade80; }
    .lose { color: #f87171; }
    .tie { color: #facc15; }

    .choices-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-choice {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      font-size: 2.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-choice:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      background: #475569;
    }

    .btn-choice:active {
      transform: translateY(0);
    }

    .reset-btn {
      margin-top: 2rem;
      background: transparent;
      border: 1px solid #64748b;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      color: #f8fafc;
      border-color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Rock Paper Scissors</h1>

    <div class="scoreboard">
      <div class="score-box">
        <h3>You</h3>
        <span id="player-score">0</span>
      </div>
      <div class="score-box">
        <h3>CPU</h3>
        <span id="cpu-score">0</span>
      </div>
    </div>

    <div class="display">
      <div class="choices-display" id="choices-display">Make your move!</div>
      <div class="result-text" id="result-text"></div>
    </div>

    <div class="choices-container">
      <button class="btn-choice" onclick="play('rock')">✊</button>
      <button class="btn-choice" onclick="play('paper')">✋</button>
      <button class="btn-choice" onclick="play('scissors')">✌️</button>
    </div>

    <button class="reset-btn" onclick="resetGame()">Reset Score</button>
  </div>

  <script>
    let playerScore = 0;
    let cpuScore = 0;

    const choices = ['rock', 'paper', 'scissors'];
    const emojis = {
      rock: '✊',
      paper: '✋',
      scissors: '✌️'
    };

    function play(playerChoice) {
      const cpuChoice = choices[Math.floor(Math.random() * choices.length)];
      
      const choicesDisplay = document.getElementById('choices-display');
      const resultText = document.getElementById('result-text');
      const playerScoreSpan = document.getElementById('player-score');
      const cpuScoreSpan = document.getElementById('cpu-score');

      choicesDisplay.textContent = `You: ${emojis[playerChoice]}  vs  CPU: ${emojis[cpuChoice]}`;

      if (playerChoice === cpuChoice) {
        resultText.textContent = "IT'S A TIE!";
        resultText.className = 'result-text tie';
      } else if (
        (playerChoice === 'rock' && cpuChoice === 'scissors') ||
        (playerChoice === 'paper' && cpuChoice === 'rock') ||
        (playerChoice === 'scissors' && cpuChoice === 'paper')
      ) {
        resultText.textContent = "YOU WIN!";
        resultText.className = 'result-text win';
        playerScore++;
        playerScoreSpan.textContent = playerScore;
      } else {
        resultText.textContent = "YOU LOSE!";
        resultText.className = 'result-text lose';
        cpuScore++;
        cpuScoreSpan.textContent = cpuScore;
      }
    }

    function resetGame() {
      playerScore = 0;
      cpuScore = 0;
      document.getElementById('player-score').textContent = '0';
      document.getElementById('cpu-score').textContent = '0';
      document.getElementById('choices-display').textContent = 'Make your move!';
      document.getElementById('result-text').textContent = '';
      document.getElementById('result-text').className = 'result-text';
    }
  </script>

</body>
</html>
